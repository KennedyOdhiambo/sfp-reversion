# SFP Reversion strategy — all tunable parameters live here, never in code.
# Every parameter in this file is a candidate for walk-forward sweeps (plan.md §5/Block 13).

data:
  source: local              # local | oanda (Block 2b)
  cache_dir: data/cache      # parquet cache, relative to project root
  oanda:
    environment: practice    # practice | live
    # account_id: ""         # set via SFP_OANDA_ACCOUNT_ID env var (never commit)
    # token: ""              # set via SFP_OANDA_TOKEN env var (never commit)
    granularity: D           # D (daily), H4, H1, ...
    price: M                 # M (midpoint), B (bid), A (ask)

levels:
  swing_lookback: 5          # fractal swing window (bars each side)
  cluster_ticks: 10          # max tick distance between swings merged into one level
  min_swing_magnitude_atr: 0.3  # min swing size in ATR, else noise
  touch_tolerance_atr: 0.1   # bar within this fraction of ATR of the level = touch
  retest_start: first_touch  # forming swing counts as touch #1
  max_retests: 2             # retests beyond this exhaust the level (pass)

confluence:
  d1_bias:
    ema_fast: 20
    ema_slow: 50
    lookback: 10             # bars confirming higher highs / lower lows
  fib:
    ratios: [0.382, 0.5, 0.618, 0.786]
    proximity_atr: 0.2       # level within this fraction of ATR of a fib = confluence
  atr_extension:
    period: 14
    multiple: 1.0            # level this far (in ATR) past the recent swing = stretched
    reference: recent_swing   # recent_swing | prior_close

confirmation:
  sfp:
    wick_atr: 0.1            # min wick beyond level, in ATR
    close_inside_atr: 0.05   # min close back inside level, in ATR
  macd:
    fast: 12
    slow: 26
    signal: 9
    use_histogram: true      # divergence on histogram (false = MACD line)
    swing_lookback: 5
    n_swings: 3              # divergence scoped to prior 3 swing lows/highs

signal:
  touch_confluence:          # touches -> required confluence factors (AND with retest gate)
    "3": 0
    "2": 1
    "1": 2
  retest_gate:               # retests -> required confirmation
    "1": sfp
    "2": sfp_macd
  min_reward_risk: 1.0       # §2.2 inverse-level filter: skip if target < this x stop distance
  special_fib_rule: true     # place limit at fib level instead of raw level when close to one
  stop_buffer_atr: 0.1       # stop beyond thrust-candle extreme, in ATR
  fta_fallback_atr: 2.0      # target when no opposing level exists: entry +/- this x ATR

backtest:
  spread_pips: 1.0
  slippage_pips: 0.5
  pip_size: 0.0001
  risk_per_trade_pct: 1.0    # fixed-fractional risk per trade
  min_equity: 10000          # starting equity

validation:
  walk_forward:
    in_sample_years: 2
    out_of_sample_years: 0.5
    min_trades: 20
  significance:
    confidence: 0.95
    deflated_trials: 50

report:
  output_dir: reports
  figsize: [12, 6]
